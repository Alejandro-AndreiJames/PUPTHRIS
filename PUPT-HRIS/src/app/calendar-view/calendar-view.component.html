<div class="calendar-container p-4">
  <div class="bg-white rounded-lg shadow-md">
    <div class="p-4">
      <!-- Calendar Header -->
      <div class="mb-4">
        <h2 class="text-2xl font-bold text-[#800000]">Observation Schedule Calendar</h2>
      </div>

      <!-- Legend -->
      <div class="flex gap-4 mb-4">
        <div class="flex items-center">
          <div class="w-4 h-4 rounded bg-[#FFA500] mr-2"></div>
          <span>Pending</span>
        </div>
        <div class="flex items-center">
          <div class="w-4 h-4 rounded bg-[#4CAF50] mr-2"></div>
          <span>Completed</span>
        </div>
        <div class="flex items-center">
          <div class="w-4 h-4 rounded bg-[#F44336] mr-2"></div>
          <span>Cancelled</span>
        </div>
      </div>

      <!-- Calendar -->
      <div>
        <full-calendar [options]="calendarOptions"></full-calendar>
      </div>
    </div>
  </div>
</div>

<!-- View Schedule Details Modal -->
<dialog id="view-schedule-modal" class="modal">
  <div class="modal-box max-w-md bg-white rounded-lg shadow-xl">
    <!-- Header -->
    <div class="bg-[#800000] text-white p-4 -m-6 mb-6 rounded-t-lg flex justify-between items-center">
      <h3 class="font-bold text-xl">Schedule Details</h3>
      <div class="badge badge-outline text-white">
        {{selectedEvent?.status}}
      </div>
    </div>

    <!-- Content -->
    <div *ngIf="selectedEvent" class="space-y-4 mt-8">
      <!-- Show faculty name for admin and superadmin -->
      <div *ngIf="canManageSchedules()" class="flex flex-col">
        <label class="text-sm text-gray-600 font-medium">Faculty</label>
        <p class="text-gray-900 font-semibold">{{selectedEvent.facultyName}}</p>
      </div>

      <div class="flex flex-col">
        <label class="text-sm text-gray-600 font-medium">Topic</label>
        <p class="text-gray-900 font-semibold">{{selectedEvent.title}}</p>
      </div>

      <div class="flex flex-col">
        <label class="text-sm text-gray-600 font-medium">Subject</label>
        <p class="text-gray-900 font-semibold">{{selectedEvent.subject}}</p>
      </div>

      <div class="flex flex-col">
        <label class="text-sm text-gray-600 font-medium">Room</label>
        <p class="text-gray-900 font-semibold">{{selectedEvent.room}}</p>
      </div>

      <div class="flex flex-col">
        <label class="text-sm text-gray-600 font-medium">Schedule</label>
        <p class="text-gray-900 font-semibold">
          {{selectedEvent.startTime}} - {{selectedEvent.endTime}}
        </p>
      </div>
    </div>

    <!-- Actions -->
    <div class="modal-action mt-8 border-t pt-4">
      <!-- Add PDF Download button -->
      <button 
        *ngIf="selectedEvent?.status === 'Completed' && selectedEvent?.evaluationId"
        (click)="downloadPdf(selectedEvent)"
        class="btn bg-blue-600 hover:bg-blue-700 text-white">
        <i class="fas fa-download mr-2"></i>Download PDF
      </button>

      <!-- Show cancel button for admin and superadmin -->
      <button 
        *ngIf="canManageSchedules() && selectedEvent?.status === 'Pending'"
        (click)="updateStatus('Cancelled')"
        class="btn bg-red-600 hover:bg-red-700 text-white">
        Cancel Schedule
      </button>

      <form method="dialog">
        <button class="btn">Close</button>
      </form>
    </div>
  </div>

  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
