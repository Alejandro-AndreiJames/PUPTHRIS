<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4">Lecture Materials</h2>
  <button class="btn btn-primary mb-4" (click)="toggleModal()">Add Lecture Material</button>

  <!-- Lecture Material Modal -->
  <div *ngIf="showModal" class="modal modal-open">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-4">{{ isEditing ? 'Edit' : 'Add' }} Lecture Material</h3>
      <form [formGroup]="materialForm" (ngSubmit)="onSubmit()">
        <div class="form-control">
          <label class="label">Title</label>
          <input type="text" formControlName="Title" class="input input-bordered" required>
        </div>

        <div class="form-control">
          <label class="label">Description</label>
          <textarea formControlName="Description" class="textarea textarea-bordered"></textarea>
        </div>

        <div class="form-control">
          <label class="label">Reference Link (Optional)</label>
          <input type="url" formControlName="ReferenceLink" class="input input-bordered" 
                 placeholder="https://...">
        </div>

        <div class="form-control">
          <label class="label">Upload File (Optional)</label>
          <input type="file" (change)="onFileChange($event)" class="file-input file-input-bordered">
        </div>

        <div class="modal-action">
          <button type="button" class="btn" (click)="toggleModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="!materialForm.valid">
            {{ isEditing ? 'Update' : 'Save' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="mt-8">
    <h3 class="text-xl font-bold mb-2">Material List</h3>
    <table class="table w-full">
      <thead>
        <tr>
          <th>Title</th>
          <th>Description</th>
          <th>Reference Link</th>
          <th>File</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let material of materials">
          <td>{{ material.Title }}</td>
          <td>{{ material.Description }}</td>
          <td>
            <a *ngIf="material.ReferenceLink" 
               [href]="material.ReferenceLink" 
               target="_blank" 
               class="link link-primary">
              View Reference
            </a>
          </td>
          <td>
            <a *ngIf="material.FilePath" 
               (click)="downloadFile(material.FilePath)" 
               class="link link-primary">
              Download File
            </a>
          </td>
          <td>
            <button class="btn btn-sm btn-info mr-2" (click)="editMaterial(material)">Edit</button>
            <button class="btn btn-sm btn-error" (click)="deleteMaterial(material.LectureID!)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
