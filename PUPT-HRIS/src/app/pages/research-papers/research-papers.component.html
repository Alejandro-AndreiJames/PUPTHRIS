<div class="flex justify-between items-center mb-6">
  <h2 class="text-xl font-semibold">Research Papers</h2>
  <button class="btn btn-primary" (click)="toggleModal()">+ Add Research Paper</button>
</div>

<!-- Research Papers List -->
<div class="overflow-x-auto">
  <table class="table w-full">
    <thead>
      <tr>
        <th>Title</th>
        <th>Authors</th>
        <th>Publication Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let paper of researchPapers">
        <td>{{paper.Title}}</td>
        <td>{{paper.Authors}}</td>
        <td>{{paper.PublicationDate | date}}</td>
        <td class="flex gap-2">
          <button class="btn btn-sm btn-info" (click)="editPaper(paper)">Edit</button>
          <button class="btn btn-sm btn-error" (click)="deletePaper(paper.ResearchID!)">Delete</button>
          <button class="btn btn-sm btn-success" (click)="downloadFile(paper.DocumentPath!)">Download</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div *ngIf="showModal" class="modal modal-open">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-4">{{isEditing ? 'Edit' : 'Add'}} Research Paper</h3>
    <form [formGroup]="researchForm" (ngSubmit)="onSubmit()">
      <div class="form-control">
        <label class="label">
          <span class="label-text">Title</span>
        </label>
        <input type="text" formControlName="Title" class="input input-bordered" required>
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Description</span>
        </label>
        <textarea formControlName="Description" class="textarea textarea-bordered"></textarea>
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Authors</span>
        </label>
        <input type="text" formControlName="Authors" class="input input-bordered" required>
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Publication Date</span>
        </label>
        <input type="date" formControlName="PublicationDate" class="input input-bordered" required>
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Reference Link (Optional)</span>
        </label>
        <input type="url" formControlName="ReferenceLink" class="input input-bordered" 
               placeholder="https://...">
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Upload Document (Optional)</span>
        </label>
        <input type="file" 
               (change)="onFileChange($event)"
               class="file-input file-input-bordered"
               accept=".pdf,.doc,.docx">
      </div>

      <div class="modal-action">
        <button type="button" class="btn" (click)="toggleModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="!researchForm.valid">
          {{isEditing ? 'Update' : 'Save'}}
        </button>
      </div>
    </form>
  </div>
</div>
